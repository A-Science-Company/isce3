# ---------------------------------------------------------------------
# nepal_glof_aoi -- the CROPPED-FIRST leg of the four-way comparison.
#
# Identical to nepal_glof.yaml except for three things:
#   granules:  the AOI-subset RSLCs from tools/rslc_subset.py, listed
#              explicitly rather than auto-discovered
#   out_root:  a SEPARATE tree, so nothing here can touch the full-tile
#              products in <case_dir>/pairs/... or <case_dir>/scratch/...
#   case_name: distinct, so provenance and logs never collide
#
# The granules are 11219 x 14719 (freq A) instead of 53200 x 54244 -- 5.72% of
# the radar grid, a ~17x reduction. Every ISCE3 stage sizes itself from
# slc.getRadarGrid(freq), so the whole chain runs small with NO workflow change.
#
# The crop carries a 500 px buffer on every side (~5x the dense_offsets dead
# band of window/2 + half_search = 52 px). Compare only the AOI interior, or
# you measure the buffer rather than the method.
# ---------------------------------------------------------------------
# =====================================================================
# Track G (GSLC) run configuration -- NEPAL GLOF
# =====================================================================
# TEMPLATE. Copy of the Venezuela config with the site-specific fields blanked.
# Every tunable below was chosen and justified on the Venezuela pair; only the
# marked fields need changing for Nepal.
#
#   python run_track_g.py --config configs/nepal_glof.yaml --only ingest
#
# BEFORE THE FIRST RUN, set:
#   1. case_dir            -- where the granules live on THIS machine
#   2. geogrid.aoi_lonlat  -- null = full frame; see the note there
#   3. frequencies/looks   -- see "sizing" below
#
# Ingest AUTO-DISCOVERS the granules from <case_dir>/L1_RSLC/ and derives
# track, frame, orbit direction, look side, dates, EPSG and the pinned geogrid
# from the products themselves. Nothing about the site is hardcoded.
#
# Data: gs://s1-slc/nepal/nisar/ascending/tile_1/
#   gsutil -m cp 'gs://s1-slc/nepal/nisar/ascending/tile_1/**/*RSLC*.h5' \
#       <case_dir>/L1_RSLC/
#
# A NOTE ON THE SCIENCE. Venezuela was a coseismic pair: the signal was
# DEFORMATION, read from unwrapped phase. A GLOF flash flood is different --
# the strongest signals are AMPLITUDE CHANGE (channel scour, new deposits,
# inundation) and COHERENCE LOSS (surface disturbance between passes). Those
# come out of stages 6-7 and need no unwrapping at all, so the open Track G
# unwrap problem is NOT blocking for a first look here. Unwrapped phase still
# matters for any co-event slope movement.
# ---------------------------------------------------------------------

case_name: nepal_glof_aoi
# CHANGE ME -- absolute path; granules go in <case_dir>/L1_RSLC/
case_dir: /home/sharath/isce3/case_studies/nepal_glof

# out_root: /home/sharath/isce3/case_studies/nepal_glof/aoi  ->  write products alongside the granules, in case_dir:
#   stack.json  cfg/  L2_GSLC/  aux/dem/  qa/  logs/  provenance/  scratch/
out_root: /home/sharath/isce3/case_studies/nepal_glof/aoi

# Empty -> auto-discover NISAR_L1_*RSLC*.h5 in case_dir and sort by acquisition
# date (earliest becomes the reference). List paths explicitly to pin the stack.
granules:
  - /home/sharath/isce3/case_studies/nepal_glof/L1_RSLC_AOI/20260714_aoi.h5
  - /home/sharath/isce3/case_studies/nepal_glof/L1_RSLC_AOI/20260726_aoi.h5

# ---------------------------------------------------------------------
# What to process
# ---------------------------------------------------------------------
# FREQUENCY B FIRST. It is the same swath and the same azimuth sampling as
# freq A but 8x fewer range samples (6582 vs 52649), so it exercises the entire
# pipeline end to end at roughly 1/8 the cost. Switch to [A] -- or [A, B] -- once
# the workflow is trusted. Note freq A at 5 m posting is a ~29 GB/pol output.
frequencies: [A]

# HH only to start. HV is present in both granules and both frequencies; adding
# it here doubles output size and geocoding time.
polarizations: [HH]

# ---------------------------------------------------------------------
# The PINNED output geogrid -- shared by every date
# ---------------------------------------------------------------------
# This is the single highest-risk parameter block in the whole workflow.
# Leaving a posting blank makes ISCE3 inherit the DEM's ~30 m spacing for a
# COMPLEX SLC, which irreversibly decimates it. The config layer rejects that.
geogrid:
  # null -> derive UTM/polar zone from the AOI centroid via
  # nisar.workflows.dumpconfig.point_to_epsg. For this AOI that yields 32619
  # (UTM zone 19N). Pin it explicitly if you ever want to force a zone.
  epsg: null

  # Corners are snapped OUTWARD to a multiple of this many metres by stage A,
  # then written as absolute top_left/bottom_right into every runconfig.
  # 1000 m divides evenly by 5, 8, 10, 20, 25, 40 and 50, so freq A and freq B
  # grids nest exactly and the corner coordinates stay readable.
  snap: 1000.0

  # Extra padding beyond the footprint union, in metres, applied before snapping.
  margin_m: 0.0

  # AOI as [west, south, east, north] in degrees. Output grid = this box
  # INTERSECTED with the granule footprint. Leave null for the full frame.
  #
  # NOT a crop of the RSLC and never needs to be: gslc.py iterates geogrid
  # blocks via rdr_geo_block_generator and reads only rslc_dataset[rdr_blk_slice],
  # so a smaller grid reads less of the 24.5 GB granule automatically. Same
  # semantics as the course's bbox_wsen in 2.1/utils.py.
  #
  # Chosen from the freq-B products already on disk: of all 60x60 km boxes with
  # >=85% land, this one had the best coherence -- median 0.632 (scene-wide is
  # 0.432), 78.6% above 0.5, 92.9% land. Western massif, inland of the coast.
  # At 5 m: 12000 x 12000 px, 2.41 GiB for the pair (HH only, uncompressed).
  # AOI as [west, south, east, north] in degrees, INTERSECTED with the granule
  # footprint. null = the full frame.
  #
  # START WITH null. Run steps 1-7 (through watermask) on frequency B, look at
  # the coherence and amplitude, and pick the AOI from what you SEE -- that is
  # how the Venezuela AOI was chosen, and the first attempt there was wrong
  # because it optimised for coherence rather than for signal.
  #
  # For a GLOF, the AOI should cover the source lake, the flood path down-valley
  # and the depositional reach. Coherence will be LOW along the flood path --
  # that is the signal, not a problem to avoid.
  #
  # This is NOT a crop of the RSLC and never needs to be: gslc.py reads only
  # the radar slice feeding each output block, so a smaller grid reads less of
  # the granule automatically.
  aoi_lonlat: null

  # Output pixel spacing in metres, per frequency. Positive; ISCE3 applies the
  # sign for the northing axis itself.
  posting:
    # Freq A: near-isotropic native ground resolution (~4.2-5.7 m range,
    # ~4.46 m azimuth), so 5 m square is the natural choice.
    A: {x: 5.0, y: 5.0}

    # Freq B is deliberately ANISOTROPIC. Range bandwidth is only 5 MHz, giving
    # ~34-46 m ground range, while azimuth is unchanged at ~4.46 m. For this
    # near-polar ascending pass the range direction lies close to easting and
    # azimuth close to northing, so the resolution cell's bounding box is about
    # 40 m in x and 13 m in y. Posting 40 x 5 m therefore samples the complex
    # signal without aliasing it. Going to y: 10.0 halves the output (1.8 GB
    # instead of 3.3 GB per pol) and still clears Nyquist, but with far less
    # headroom -- change it only deliberately.
    # 5 x 5 -- IDENTICAL to A, deliberately, not freq B's native anisotropic
    # sampling. The split-spectrum ionosphere port needs both frequencies on the
    # SAME map lattice so the per-pixel dispersive solve needs no inter-band
    # resampling. Geocoding gives that for free; Track R could not, because the
    # 8:1 range ratio forced ISCE3 to solve on freq B's coarse grid and
    # interpolate back (ionosphere.py:226 decimate / :356 interpolate).
    # Oversampling freq B's 45.6 m range resolution onto a 5 m grid is
    # redundant, not wrong -- and the pair then multilooks 8x8 to 40 m together.
    B: {x: 5.0, y: 5.0}

  # Geometry cubes (incidence, LOS, ...) written into the product metadata.
  # Coarse on purpose: these are smooth fields, unrelated to image posting.
  radar_grid_cube:
    posting: 1000.0
    heights: [-500.0, 0.0, 500.0, 1000.0, 1500.0, 2000.0, 3000.0]

# ---------------------------------------------------------------------
# DEM staging (stage B)
# ---------------------------------------------------------------------
dem:
  # NISAR: native WGS84 ELLIPSOIDAL heights, which is what ISCE3 geocoding
  # requires. Hard precondition: a free NASA Earthdata account with an entry
  # for urs.earthdata.nasa.gov in ~/.netrc. sardem enforces this before any
  # network call, so a missing credential fails instantly rather than midway.
  source: NISAR

  # Copernicus GLO-30 fallback. Delivered as EGM2008 and converted to WGS84 by
  # sardem, so it is also ellipsoidal -- but ocean arrives as nodata == 0 by
  # design on this route, so ocean == 0 there is NOT a datum bug.
  fallback: COP

  # null -> <out_root>/aux/dem/dem_<case_name>.tif
  path: null

  # Degrees of padding around the AOI (which already includes the snapped UTM
  # box, not just the footprint). The binding constraint is NOT the 1 km snap --
  # it is terrain-induced geolocation shift, which scales with RELIEF:
  #
  #     shift = height / tan(incidence)
  #
  # This frame reaches 8084 m at 41.1 deg incidence -> 9266 m -> 0.095 deg of
  # longitude at 28.7 N. 0.1 deg left only 5% margin; 0.15 deg gives 58%.
  #
  # 0.1 deg was inherited from the Venezuela case, whose relief is ~2 km. Do not
  # copy this number between sites without redoing the arithmetic above.
  #
  # DO NOT chase this warning, which fires on EVERY block regardless:
  #     "East/South limit may be insufficient for global height range"
  # Topo::computeDEMBounds (cxx/isce3/geometry/Topo.cpp:311) sizes the DEM
  # window it requests by running topo at _minH and _maxH, which
  # nisar.workflows.rdr2geo never sets -- so they keep the HARDCODED planetary
  # defaults GLOBAL_MIN_HEIGHT = -500 m and GLOBAL_MAX_HEIGHT = +9000 m
  # (cxx/isce3/core/Constants.h:53-56). That 9500 m span asks for 10.9 km of
  # ground spread = 0.112 deg here, and DEMInterpolator.cpp:267-285 then CLAMPS
  # to the file edge and warns. Any windowed DEM triggers it near its boundary.
  # It is harmless as long as the buffer covers the ACTUAL relief shift, which
  # is what the arithmetic above sizes. Silencing it entirely would need
  # buffer_deg >= 0.112 measured from the radar block perimeter, not the
  # footprint -- more DEM for no accuracy gain.
  buffer_deg: 0.15

  # null -> sardem's own cache location
  cache_dir: null

# ---------------------------------------------------------------------
# GSLC generation (stage G1). Keys map 1:1 onto the installed gslc schema.
# ---------------------------------------------------------------------
gslc:
  # MUST stay true. Flattening strips the range carrier phase; leaving it in is
  # irreversible downstream and every interferogram would carry a huge ramp.
  # The config layer refuses to run with this set false.
  flatten: true

  # Geolocation-only for GSLC, but it differs between the two dates, so leaving
  # it on removes a few-cm relative bias.
  solid_earth_tides: true

  data_type: complex64_zero_mantissa
  compression_enabled: true
  compression_level: 1          # 1 = fastest; these rasters are large
  chunk_size: [512, 512]
  shuffle: true
  fs_strategy: page
  fs_page_size: 4194304

  # Geocoding block size in output pixels. 1024 x 1024 complex64 is 8 MiB per
  # block, which is comfortable against ~4 GB free RAM.
  blocksize: {x: 1024, y: 1024}

  geo2rdr: {threshold: 1.0e-8, maxiter: 25}

  # No CUDA device on this machine.
  gpu_enabled: false

  # Keep ISCE3 from attempting its own DEM download; stage B owns the DEM.
  internet_access: false

  debug_switch: false

  # Optional per-date ancillary overrides, keyed by YYYYMMDD. Left empty, the
  # orbit and TEC embedded in the RSLC are used.
  #   orbit_files: {"20260613": /path/to/orbit.xml}
  #   tec_files:   {"20260613": /path/to/tec.json}
  orbit_files: {}
  tec_files: {}

# ---------------------------------------------------------------------
# QA (decimated reads only -- never loads a full raster)
# ---------------------------------------------------------------------
qa:
  enabled: true
  max_pixels: 2000              # target long edge of each overview
  max_read_bytes: 268435456     # 256 MiB cap on any single block read
  dpi: 110
  rslc_quicklook: true          # also quicklook the input RSLCs in radar coords

# ---------------------------------------------------------------------
# Interferogram (stage G3) -- conjugate product, coherence, per-date amplitude
# ---------------------------------------------------------------------
# Runs BEFORE watermask: the mask is built on this stage's grid so it is
# pixel-aligned by construction.
igram:
  enabled: true

  # null -> first entry of `frequencies` / `polarizations` above.
  # THE POLARIZATION IS HH AND THAT IS ALL THERE IS. The granules are DHDH
  # (HH + HV) and the L2 GSLCs carry HH only -- there is no VV anywhere in this
  # product. Where a VV amplitude is wanted, HH is the correct co-pol
  # substitute, and every label downstream says HH rather than VV.
  freq: null
  pol: null

  # Block-average factors in ROWS and COLUMNS of the GSLC grid (not radar
  # range/azimuth). The freq-B posting is 40 x 5 m, so 16 rows x 2 cols gives
  # square 80 x 80 m output pixels: 59800 x 7575 -> 3737 x 3787.
  # freq A posting is 5 x 5 m -- essentially SQUARE (native 4.72 rg x 4.46 az),
  # so equal looks are correct here. 16 x 16 -> 80 x 80 m, matching the freq-B
  # product's analysis scale so the two bands are directly comparable.
  # (The asymmetric 16 x 2 above was for freq B's 40 x 5 m posting.)
  # Sliding-window size for coherence. Used whenever the look box has FEWER
  # samples than the window would (looks_y*looks_x < coherence_window**2), which
  # is the case for every small look setting. Phase is unaffected.
  # 1 x 1 -- FULL 5 m resolution, matching Track R's 1x1 product. The point of
  # running Track G is to compare it against Track R at ~5 m, so multilooking
  # here would throw away exactly the resolution under test.
  #
  # This works ONLY because igram.py:214 falls back to a SLIDING window when
  # looks_y*looks_x < coherence_window**2: at 1x1 (1 < 9) coherence comes from
  # a 3 x 3 moving window, grid unchanged, phase per-pixel. That is the same
  # estimator tools/slc_coherence.py applies on the Track R side, so both
  # tracks' coherence is computed identically (bias floor 0.295 on both).
  #
  # Contrast ISCE3's crossmul, which has NO sliding window and hardcodes
  # coherence = 1.0 at 1x1 (cxx/isce3/signal/Crossmul.cpp:378-388).
  coherence_window: 3
  looks_y: 1
  looks_x: 1

  # Streaming block height in GSLC rows. Multiple of BOTH looks_y (16) and the
  # 512-row HDF5 chunking, so look boxes never straddle a block boundary and
  # gzip never re-inflates the same chunk twice. ~350 MB peak.
  block_rows: 512

  # Each date's own multilooked amplitude, on the same grid. The pair's .amp
  # band is the GEOMETRIC MEAN of the two dates and cannot show per-date
  # backscatter, which is what the overlay needs.
  per_date_amplitude: true

  # Empty -> every consecutive date pair (here: one, 20260613 x 20260625).
  pairs: []

  pair_dir_template: "pairs/{ref}_{sec}/trackG"
  # {ly}/{lx} are the looks, and they are in the name because they CHANGE THE
  # OUTPUT: a re-run at different looks writes a different grid. Without them
  # the new product silently overwrites the old one and still passes exists().
  prefix_template: "ifg_{freq}_{pol}_{ly}x{lx}"

# ---------------------------------------------------------------------
# Water mask -- substitute for the course's NASADEM bit-15 route, which is
# broken upstream (SRTMSWBD 404s; sardem substitutes zeros and exits 0).
#
# The threshold is applied to ORTHOMETRIC height. Our DEM is WGS84 ellipsoidal
# and local sea level is about -28 m ellipsoidal here, so the course's `h <= 0`
# used unchanged would drown 1,591 km2 of real coastal land. See watermask.py.
# ---------------------------------------------------------------------
watermask:
  enabled: true
  method: dem_orthometric
  # Built on the interferogram grid, so it is pixel-aligned by construction.
  # null -> derived from igram.freq / igram.pol and the pair on disk. Setting a
  # literal here goes stale whenever frequency, polarization or the pair changes.
  reference_raster: null
  geoid_crs: EPSG:9518          # WGS84 + EGM2008 height
  sea_level_margin_m: 1.0       # H <= this is water; flat plateau over 0.25-3 m
  include_inland: false         # true also catches Lake Valencia (dark + elevated)
  # A box of open Caribbean, in the grid CRS (EPSG:32619). The stage asserts
  # this comes out >95% water -- the check the broken NASADEM route would fail.
  # Keep it well inside the swath: the swath is a rotated parallelogram in a
  # north-up bounding box, so boxes near the NE corner are mostly nodata.
  # Verified 100% water against the orthometric DEM for the CURRENT aoi_lonlat.
  # Must lie inside the grid; the stage now clamps and warns instead of failing.
  ocean_probe: [580000.0, 1176000.0, 600000.0, 1196000.0]
  min_water_fraction: 0.01
  max_water_fraction: 0.95

# ---------------------------------------------------------------------
# Unwrapping (stage G4) -- a faithful port of the course chain, in its order:
#   Goldstein filter -> phase-sigma coherence -> water mask -> zero the
#   interferogram at invalid -> snaphu -> zero unw and conncomp at invalid
#
# The correlation fed to SNAPHU is the PHASE-SIGMA coherence computed from the
# FILTERED interferogram -- NOT the boxcar coherence in ifg_B_HH.coh.tif, which
# is the display/QA product. Both course drivers pass filt_mli.phsig.coh.tif.
# ---------------------------------------------------------------------
unwrap:
  enabled: true

  # Goldstein. Both are the ISCE2 topsApp defaults and the course never changes
  # them. alpha is the exponent in H = |S|**alpha; psize is the FFT patch, with
  # 50% overlap and a triangular taper applied after the inverse FFT.
  filter_alpha: 0.5
  filter_psize: 32

  # Phase-sigma window sizes. The course does not even expose these from its
  # wrapper -- they are always 5 / 5.
  phsig_win: 5
  phsig_grad_win: 5

  # Course value is 500. Raising it is a pure speed/memory change with NO
  # numerical effect: same iteration order, same arithmetic, ~1 MB per batch.
  phsig_batch: 5000

  # THE ASYMMETRY THAT SILENTLY BREAKS A PORT OF THIS CHAIN.
  #   phsig  gets the NOMINAL looks           = looks_y * looks_x     = 32
  #   snaphu gets the EFFECTIVE looks         = 32 / 1.2^2            = 22.22
  # null derives the nominal count from igram.looks_y * igram.looks_x so the two
  # cannot drift apart. In the course's 4 x 2 setup these are 8 and 5.56, and
  # its phsig helper's DEFAULT nlks is also 8 -- so copying its bare call here
  # would silently pass 8 instead of 32 and badly overestimate coherence.
  nlooks_nominal: null
  # 1.2 per dimension (1.44 total) is the ISCE2 convention for nominal -> ENL.
  # It is not derived for a geocoded GSLC geometry, but it errs conservative and
  # it agrees with the measured coherence floor: sqrt(pi)/(2*sqrt(22)) = 0.189,
  # which is where open water sits in this scene.
  oversample_factor: 1.2

  cost: smooth
  init: mcf

  # SINGLE TILE, SINGLE PROCESS -- the course's settings. Nothing about tiling
  # or parallelism is configured anywhere in the course. [4, 4] with nproc 8 is
  # far faster and lighter on this 14.2 Mpx grid, but per-tile reoptimisation
  # changes the solution and the connected-component labelling: a scientific
  # change, not a performance flag. The config layer warns if you change it.
  # TILED. At 1x1 looks the grid is ~662 Mpx; a single-tile solve needs ~250 GB.
  # Measured scaling: peak RAM tracks TILE size x nproc, not total grid
  # (4.94 Mpx needs 1.77 GB untiled but 0.55 GB at [4,4] with nproc 4).
  # [20,40] -> ~890 x 930 px tiles; +200 px overlap each side -> ~1.7 Mpx
  # effective, ~0.66 GB per process, ~5.3 GB at nproc 8.
  #
  # tile_overlap is a CORRECTNESS parameter, not a speed knob: it is the region
  # snaphu uses to resolve the integer 2*pi offset between neighbouring tiles.
  # Too small and adjacent tiles settle on offsets differing by a cycle, giving
  # a seam that can masquerade as a fault. 200 px = 1 km at 5 m posting.
  ntiles: [10, 17]
  tile_overlap: 200
  nproc: 4
  # MUST be false whenever ntiles != [1,1] on a memory-bounded box. snaphu-py:
  # "after unwrapping with multiple tiles, an additional post-processing
  # unwrapping step is performed to re-optimize the unwrapped phase using a
  # SINGLE tile" -- i.e. it undoes the entire memory benefit of tiling in the
  # last step. At 169 Mpx that final pass needs ~65 GB (385 B/px measured).
  # Cost of false: conncomp labels come from the tiled solution and stitching,
  # not a global re-solve, so seams matter more. regrow_conncomps then applies.
  single_tile_reoptimize: false
  # Also false: snaphu regrows conncomp labels "using a single tile" too, so it
  # carries the same full-grid memory cost (cheaper -- labelling, not a re-solve
  # -- but still unbounded by tile size). CAVEAT: with both off, conncomp labels
  # come from the tiled solution and its stitching, so check seams before
  # trusting component boundaries near the fault.
  regrow_conncomps: false

  # Applied by ZEROING the interferogram, not via snaphu's mask= argument --
  # that is what the course does, and switching changes conncomp labelling.
  water_mask: true
  # Refuse to unwrap if the mask covers more than this fraction of the swath.
  # An all-water mask is the exact signature of the broken NASADEM producer,
  # which pre-fills its mosaic with WATER and exits 0 when every tile 404s.
  # Measured here: 47.2% water, so 0.60 leaves real headroom.
  water_max_fraction: 0.60

  # null -> snaphu's own temp dir. Point at the case scratch/ if /tmp is small.
  scratchdir: null

# ---------------------------------------------------------------------
# Overlay (stage G5) -- folium HTML over Google Satellite tiles
# ---------------------------------------------------------------------
overlay:
  enabled: true
  opacity: 0.85

  # 1 = full resolution, sidecar PNGs (~39 MB total, layers load on demand).
  # 2 = 160 m pixels, which is what makes `embed: true` reasonable.
  decimate: 1

  # false -> write PNGs beside the HTML and link them, so only the visible
  # layer is fetched. true -> a single portable file, ~4/3 the PNG bytes,
  # parsed on every load regardless of which layers are on.
  embed: false

  zoom_start: 9
  basemap_url: "https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}"
  basemap_attr: "Google Satellite"
  max_zoom: 20

  # Amplitude is stretched over a scale POOLED across both dates, otherwise the
  # two are not comparable. Coherence and wrapped phase are never stretched.
  amplitude_percentiles: [2.0, 98.0]
  unwrap_percentiles: [2.0, 98.0]

  # Also show the phase-sigma coherence -- the correlation SNAPHU actually saw,
  # which is not the same raster as the displayed boxcar coherence.
  include_phsig: true

  html_name: trackG_overlay.html

# ---------------------------------------------------------------------
# TRACK R -- RSLC coregistration in RADAR coordinates (run_track_r.py)
# ---------------------------------------------------------------------
# The conventional reference-scene chain, the direct analogue of the ISCE2
# Sentinel-1 workflow and the counterpart to Track G above:
#
#   rdr2geo -> geo2rdr -> coarse_resample -> dense_offsets -> rubbersheet
#           -> fine_resample -> crossmul   [-> filter -> unwrap -> geocode]
#
# What it buys over Track G: the REFERENCE image is never resampled (only the
# secondary is), and looks are set in radar geometry -- genuinely the ISCE2
# knob. It also has dense_offsets (ampcor) + rubbersheet, the data-driven
# refinement Track G has no equivalent for.
#
# THE COST, AND WHY IT IS NOT WHAT YOU EXPECT. Looks are consumed at `crossmul`,
# the LAST stage. Every stage before it runs at FULL radar-grid resolution, so
# raising looks reduces neither RAM, nor scratch, nor runtime -- only the size of
# the final interferogram. rdr2geo alone writes x/y/z as Float64 over the whole
# reference grid. Measured for this frame, per pair:
#
#   freq B  (54720 x 6780  =  371 Mpx):   ~21 GB scratch
#   freq A  (54720 x 54239 = 2968 Mpx):  ~170 GB scratch
#
# The runconfig step prints this bill and refuses to start without the room.
track_r:
  enabled: true

  # Frequency to coregister -- ONE only; the chain is per-frequency and the
  # scratch cost of the other band is not shared. B is the tractable choice on
  # this box: same swath and azimuth sampling as A, 8x fewer range samples.
  frequency: B

  # HH is the only co-pol in these DHDH (HH + HV) granules. There is no VV.
  polarization: HH

  # RUNW, not RIFG. The ionosphere stage is gated on 'RUNW' in out_paths
  # (insar.py:120-124), so under RIFG it is skipped SILENTLY -- no error, no
  # output. Reaching split-spectrum therefore REQUIRES unwrapping.
  # GUNW would add geocoding (and is what a troposphere run needs later).
  product_type: RUNW

  # Multilook applied at crossmul, keyed by frequency. Keyed rather than shared
  # because the two bands have the SAME azimuth spacing (4.454 m) but an 8x
  # different range spacing, so one (azimuth, range) pair cannot be right for
  # both. `range` multiplies the SLANT range spacing; the ground cell is
  # `range * sceneCenterGroundRangeSpacing`, which already carries 1/sin(inc).
  #
  #   freq A native: 4.454 m az x  4.750 m ground range
  #     5 x 5  ->  22.3 x  23.7 m   <- configured
  #     9 x 8  ->  40.1 x  38.0 m
  #   freq B native: 4.454 m az x 37.998 m ground range
  #     9 x 1  ->  40.1 x  38.0 m   <- configured, ~40 m and near-square
  #     5 x 5  ->  22.3 x 190.0 m   (8.5:1 -- freq B range is ALREADY 38 m)
  looks:
    # A at 1x1: the coregistration is native-resolution either way -- looks only
    # size the RIFG -- so this is a deliberate choice to keep the interferogram
    # at full resolution too. It costs 34.6 GB of RIFG instead of 2.2 GB at 4x4,
    # and its coherence band will be identically 1.0 (single-sample estimator).
    # Fine when the coregistered SLC pair is the deliverable, which it is here.
    A: {azimuth: 1, range: 1}
    B: {azimuth: 9, range: 1}

  # Empty -> every consecutive date pair, matching igram.pairs semantics.
  # Three dates here give two pairs: 20260714x20260726 and 20260726x20260819.
  # Each pair re-runs rdr2geo, because the reference changes.
  pairs: []

  # Refuse to start unless this much would remain free afterwards.
  min_free_gb: 60.0
  # false -> warn instead of refusing. Only if you have checked the disk.
  enforce_disk_gate: true

  # -- stage knobs, mapped 1:1 onto the installed insar schema -------------
  # Memory budget per streaming block, MB. The lines_per_block values below are
  # CAPS, not literals: the effective height is derived from this budget and the
  # frequency's range width, so one config is right for both bands.
  #   freq B (6781 rg): 1000 lines of rdr2geo =  163 MB -> cap applies
  #   freq A (54244 rg): 1000 lines           = 1302 MB -> derived down to ~196
  # A fixed value tuned on freq B is an OOM kill hours into a freq A run.
  block_budget_mb: 256.0

  rdr2geo_threshold: 1.0e-7
  rdr2geo_numiter: 25
  rdr2geo_extraiter: 10
  rdr2geo_lines_per_block: 1000

  geo2rdr_threshold: 1.0e-8
  geo2rdr_maxiter: 25
  geo2rdr_lines_per_block: 1000

  # ampcor. THE INTERLOCK: setting this false forces rubbersheet off, which
  # forces fine_resample off, and crossmul then falls back to the COARSE
  # (geometry-only) resampled secondary. That is a scientific change, not a
  # speed flag -- it removes the data-driven refinement entirely.
  dense_offsets_enabled: true
  dense_offsets_lines_per_block: 1000
  window_range: 64
  window_azimuth: 64
  half_search_range: 20
  half_search_azimuth: 20
  skip_range: 32
  skip_azimuth: 32

  coarse_lines_per_tile: 1000
  coarse_columns_per_tile: 1000
  fine_lines_per_tile: 100
  fine_columns_per_tile: 0

  # flatten removes the flat-Earth/topographic carrier at crossmul. Unlike the
  # GSLC case this is NOT irreversible -- crossmul re-derives it from geometry.
  crossmul_flatten: true
  # Below 2 the conjugate product aliases.
  crossmul_oversample: 2
  crossmul_lines_per_block: 1024
  common_band_range_filter: false
  common_band_azimuth_filter: false

  gpu_enabled: false

  # ---------------------------------------------------------------------
  # Phase unwrapping -- required to reach ionosphere, NOT wanted for its own
  # sake. These looks are INDEPENDENT of `looks` above.
  #
  # unwrap.py:122-135 re-runs crossmul from the coregistered SLCs at these
  # factors, so the RUNW grid gets a freshly computed coherence. That is the
  # whole reason the RIFG can stay at 1x1 (where the single-sample coherence
  # estimator is degenerately 1.0) and still be unwrappable.
  #
  # 4x4 is a MEMORY constraint, not taste: unwrap.py:278-279 reads the whole
  # interferogram and coherence into RAM.
  #   freq A 1x1: 23.1 GB + 11.5 GB = 34.6 GB  -> over this box's 31 GB
  #   freq A 4x4:  1.4 GB +  0.7 GB =  2.2 GB  -> comfortable
  # RUNW grid becomes 13300 x 13561 = 180 Mpx, ground cell ~17.8 x 19.0 m.
  # 1x1 -- full resolution, matching crossmul. Possible only because
  # tools/patches/unwrap.py streams the inputs via snaphu.io.Raster instead of
  # loading them: stock open_raster() would need 23.1 + 11.5 = 34.6 GB here.
  # 9 az x 8 rg -> 40.1 x 38.0 m, grid 5911 x 6780.
  # THIS KEY ALSO SETS THE FREQUENCY B LOOKS. ionosphere.py:668-681 copies
  # phase_unwrap looks into crossmul for the freq B pair it builds, so the two
  # bands land on the SAME grid -- freq A 9x8 (54244/8) and freq B 9x1 (6781/1)
  # both give 6780/6781 range samples, because the 8:1 range-spacing ratio
  # exactly cancels. That is what main_side_band's per-pixel 2x2 solve needs.
  phase_unwrap_range_looks: 8
  phase_unwrap_azimuth_looks: 9
  unwrap_algorithm: snaphu
  # Tiled: the stock default is [1,1] / nproc 1, which would solve 180 Mpx
  # single-tile on one core. 8 cores are available now.
  # snaphu peak RAM is per-TILE x nproc, at a measured 385 bytes/pixel.
  # On the 13300 x 13561 RUNW grid:
  #   [4,4]   13.06 Mpx tiles -> 5.03 GB/proc -> 40.2 GB across 8   OOM
  #   [8,8]    3.74 Mpx tiles -> 1.44 GB/proc -> 11.5 GB            OK
  #   [12,12]  1.89 Mpx tiles -> 0.73 GB/proc ->  5.8 GB            safest
  # At 1x1 the grid is 53200 x 54244, so tiles must be small enough that
  # per-tile RAM x nproc fits. At 385 bytes/pixel:
  #   [16,16] ovl 256 -> 5.03 GB/proc x8 = 40.2 GB   too big
  #   [32,32] ovl 256 -> 1.85 GB/proc x8 = 14.8 GB   OK
  #   [48,48] ovl 256 -> 1.02 GB/proc x8 =  8.2 GB
  # OFF for the 1x1 pass. unwrap.py:356 reads the whole unwrapped phase with
  # dst_h5[unw_path][()] and bridge_unwrapped_phase then adds a bool mask and an
  # int32 label array: 11.5 + 2.9 + 11.5 = ~26 GB on the 2886 Mpx grid, AFTER
  # snaphu has already run for hours. Re-enable for the multilooked pass, where
  # the same arrays are 1/72 the size.
  # Resume a standalone unwrap against a finished RIFG instead of repeating the
  # 8.5 h coregistration. Emitted as phase_unwrap.crossmul_path.
  # MUST be null for the AOI run. Inherited from the full-tile config this
  # pointed at <case>/scratch/trackR/20260714_20260726_A_HH_1x1/RIFG.h5 -- the
  # FULL-SCENE interferogram. Left set, the cropped run would have unwrapped
  # the full tile and silently reported it as the AOI result.
  unwrap_crossmul_path: null

  # Back ON: the whole-array read at unwrap.py:356 is 40 Mpx here, not 2886 --
  # 0.16 GB instead of the ~26 GB that forced it off for the 1x1 pass.
  unwrap_bridge_enabled: true

  # 40 Mpx grid: [4,4] tiles are 1734 x 1951 = 3.4 Mpx -> 1.30 GB/proc.
  # AOI grid is 11219 x 14719; at 9x8 unwrap looks that is 1246 x 1839, so a
  # 4x4 tiling gives ~312 x 460 tiles -- plenty. Tile count is a memory knob
  # (peak = per-tile x nproc at 385 B/px), and this grid is 17x smaller.
  unwrap_ntiles: [2, 2]
  # OVERLAP IS A CORRECTNESS PARAMETER, not a speed knob: it is the region
  # snaphu uses to resolve the integer 2*pi offset between neighbouring tiles.
  # Too small and adjacent tiles settle on offsets differing by a cycle, leaving
  # a seam that can masquerade as signal. It matters MORE here because
  # single_tile_reoptimize is false, so the tiled solve plus its stitching IS
  # the final answer -- there is no global pass to clean up cycle mismatches.
  # At 1x1 (4.454 m az, 4.750 m rg) against ~1662 x 1695 px tiles:
  #   128 px ->  570 m az /  608 m rg   ~7.7% of tile   thin
  #   256 px -> 1140 m az / 1216 m rg   ~15% of tile    used
  unwrap_tile_overlap: [256, 256]
  unwrap_nproc: 4
  # Effective looks for snaphu. MUST be set explicitly whenever crossmul looks
  # and phase_unwrap looks differ. Left null, unwrap.py:563 derives it as
  #     rg_spac * az_spac / (rg_res * az_res)
  # reading the spacings from the RIFG's own interferogram group -- i.e. the
  # CROSSMUL grid, not the grid it is actually unwrapping. At crossmul 1x1 the
  # SLC is oversampled relative to its resolution cell, so that ratio is < 1
  # and snaphu refuses:
  #     ValueError: nlooks must be >= 1, instead got 0.6189996726516942
  # The array being unwrapped is the 4x4 re-multilook, whose spacings are 4x in
  # each dimension, so its effective looks is 16 x 0.6190 = 9.904.
  # At phase_unwrap 1x1 the unwrap grid IS the crossmul grid, so unwrap.py:563
  # would at least be self-consistent -- but it still yields 0.6190 (< 1, which
  # snaphu rejects) because a 1x1 SLC is OVERSAMPLED relative to its own
  # resolution cell. 1.0 is the honest floor: one independent look per sample.
  # ISCE3 derives 0.6190 at 1x1 (unwrap.py:563, oversampled SLC). The unwrap
  # grid here is 9x8, so its effective looks is 72 x 0.6190 = 44.57.
  unwrap_nlooks: 44.57

  # Both MUST be false while tiled. Each re-solves or relabels over the whole
  # grid -- 180.4 Mpx x 385 B = 69 GB -- undoing the entire point of tiling.
  # The price is that connected components come from the tiled solve and its
  # stitching, so check seams before trusting component boundaries.
  unwrap_single_tile_reoptimize: false
  unwrap_regrow_conncomps: false

  # ---------------------------------------------------------------------
  # Ionosphere -- split spectrum across frequencies A and B
  # ---------------------------------------------------------------------
  # main_side_band is the right method for NISAR DHDH data. A and B share a
  # starting range (878242.006 m) and their range spacings are in an EXACT 8:1
  # ratio (24.9827 / 3.1228), so decimating A onto B is exact at any look
  # factor. split_main_band instead splits A's own 40 MHz into sub-bands,
  # costing two extra full-resolution unwraps and ~92 GB of sub-band SLCs,
  # and is measurably noisier for this geometry.
  #
  # Only frequency A is listed. ionosphere.py builds the frequency B pair
  # itself by decimating frequency A's geo2rdr/rubbersheet offsets -- a second
  # Track R run on frequency B is NOT required.
  #
  # CAVEAT worth knowing before trusting the output: A is 40 MHz and B is
  # 5 MHz, and their centres are only 54.5 MHz apart (1.239 vs 1.2935 GHz).
  # The dispersive/non-dispersive inversion amplifies unwrapped-phase noise by
  # roughly 17x. The dispersive filter below is not optional -- unfiltered,
  # the correction is worse than no correction.
  # OFF for the 1x1 pass, ON for the 40 m pass. This is NOT optional bookkeeping:
  # ionosphere.py:668-681 derives the frequency B looks from the SAME
  # phase_unwrap key that sets frequency A, so at phase_unwrap 1x1 the whole
  # split-spectrum solve would run at 1x1 -- where coherence is identically 1.0,
  # the filter_mask_type ['coherence'] gate therefore passes every pixel, and
  # raw single-look speckle feeds a 16.8x-amplifying dispersive inversion.
  ionosphere_enabled: true
  ionosphere_spectral_diversity: main_side_band
  ionosphere_lines_per_block: 1000
  ionosphere_filter_enabled: true
  ionosphere_filter_coherence_threshold: 0.5
  ionosphere_median_filter_size: 15

  pair_dir_template: "pairs/{ref}_{sec}/trackR"

# ---------------------------------------------------------------------
# Stage toggles. The CLI's --only / --start-step / --stop-step layer on top.
# ---------------------------------------------------------------------
steps:
  ingest: true
  dem: true
  gslc: true
  gridgate: true
  qa: true
  igram: true
  watermask: true
  unwrap: true
  overlay: true
