# Daily driver: isce3 (NISAR workflows) + COMPASS (Sentinel-1 CSLC).
#
# Deliberately EXCLUDES isce2: isce2 2.6.x pins libgdal-core >=3.10.3,<3.11,
# which drags isce3 back to 0.24.4 (2025-04-30). Keeping isce2 out is what
# buys us isce3 0.25.12. The existing isce2_env stays untouched.
#
# Also excludes dolphin (compass pins scipy<1.13, dolphin wants scipy>=1.12)
# -- see dolphin_env.yml.
#
# python=3.12, NOT 3.11.  Learned the hard way: `pygrib` (a hard dependency of
# `pyaps3`, which nisar/workflows/troposphere.py imports at module scope) has NO
# py311 build on conda-forge. On python=3.11, `from nisar.workflows import insar`
# dies with ModuleNotFoundError: No module named 'pyaps3'. Moving to 3.12 also
# lets rasterio/rioxarray co-install with libgdal-core 3.12.4.
#
# Verified installed on this machine 2026-08-13:
#   python 3.12.13, isce3 0.25.12 py312he11b1ec_0_cpu, compass 0.5.6,
#   s1reader 0.2.5, burst2safe 2.0.2, sentineleof 0.13.0, sardem 0.13.0,
#   snaphu 0.4.1, gdal 3.12.4, h5py 3.16.0, pyaps3 0.3.7, pygrib 2.1.8,
#   numpy 1.26.4, scipy 1.12.0 (capped by compass <1.13), rasterio 1.5.0
name: isce3_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # --- engines ---
  # isce3 CPU variant is auto-selected: no __cuda virtual package on this box
  # (AMD Radeon 680M iGPU, no nvidia-smi/nvcc). Every *_cuda build requires
  # __cuda >=12, so the solver cannot pick one. No flag needed.
  - isce3
  - compass          # s1_cslc.py, s1_geocode_stack.py, compass.utils.iono
  - s1reader         # load_bursts / get_orbit_file_from_dir / S1BurstId
  - snaphu           # snaphu-py: snaphu.unwrap()
  - pyaps3           # REQUIRED: nisar/workflows/troposphere.py imports it at module
                     # scope, so `from nisar.workflows import insar` fails without it.
                     # Pulls pygrib (py312+ only) and cdsapi.

  # --- data acquisition ---
  - burst2safe       # provides the `burst2stack` CLI
  - sentineleof      # provides the `eof` CLI
  - sardem           # Copernicus GLO-30 DEM
  - asf_search       # OPERA CSLC-S1-STATIC download

  # --- I/O ---
  - gdal
  - libgdal-hdf5
  - libgdal-netcdf
  - h5py
  - netcdf4

  # --- imports in 2026-isceplus/2.1_ISCE3_TOPS_Processing/utils.py that the
  #     above do not pull in ---
  - pyproj           # dropped from isce3 deps in 0a8df45d; utils.py still needs it
  - pyyaml           # isce3 ships ruamel.yaml, which does NOT provide `import yaml`
  - lxml
  - requests
  - scikit-image
  - tqdm
  - matplotlib-base
  - rasterio         # fits at py312 (rasterio 1.5.0 vs libgdal-core 3.12.4);
  - rioxarray        # it is the py311 pin that made these unsatisfiable

  # --- notebooks ---
  - jupyterlab
  - ipykernel
  - ipympl
  - pip
